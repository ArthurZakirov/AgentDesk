[project]
name = "AgentDesk-docs"
version = "0.1.0"
description = "README generation utilities for AgentDesk."
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7,<14",
    "toc-markdown>=0.1.0,<0.2",
    "pyyaml>=6.0,<7",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]
